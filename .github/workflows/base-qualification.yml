name: BASE source and qualification replay
on:
  push:
    branches: [main]
    paths:
      - 'safevision/**'
      - 'evidence/v3/**'
      - 'artifacts/releases/BASE_26102004_5cff94e/**'
      - 'artifacts/board_validation/four_features_BASE_KEYFIX_5cff94e/**'
      - 'artifacts/releases/BASE_26102301_6a957b0/**'
      - 'artifacts/releases/BASE_26102801/**'
      - 'docs/releases/BASE_26102301/**'
      - 'docs/**'
      - 'evidence/debug_history/**'
      - 'evidence/repository_cleanup_261026/**'
      - 'evidence/board/**'
      - 'README.md'
      - 'SAFEVISION_CURRENT.md'
      - '.gitattributes'
      - '.github/workflows/base-qualification.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Checkout temporarily changes HOME. Supply Git's command-scope config
      # as well, so the long-path setting applies before any checkout occurs.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4 tag resolved at delivery
        with:
          fetch-depth: 0 # The independent frozen references require history.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/artifacts/*
            /artifacts/releases/
            !/artifacts/releases/*
            /artifacts/releases/BASE_26102301_6a957b0/
            /artifacts/releases/BASE_26102801/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # official v4
        with:
          node-version: '24'
      - name: Install pinned evidence-audit dependencies
        run: python -m pip install pypdf==6.10.0 numpy==2.3.5 PyYAML==6.0.3
      - name: Reject corrupted or escaping ticker evidence archives
        run: python -B safevision/tools/test_ticker_archive261028.py
      - name: Reject inconsistent UART evidence using synthetic fixtures
        run: python -B safevision/tools/test_ticker_uart261028.py
      - name: Verify debug archives, retained evidence and documentation links
        shell: pwsh
        run: |
          python -B safevision/tools/audit_repository_records.py --output "$env:RUNNER_TEMP/safevision-records.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay ticker delivery and all preserved baseline checks
        shell: pwsh
        run: |
          $run = Join-Path $env:RUNNER_TEMP 'safevision-base-audit'
          # verify_ticker_ci also runs test_base_delivery.py,
          # test_current_base_ci.py, test_repository_records.py and
          # verify_current_base_ci.py in the immutable09fa baseline checkout.
          python -B safevision/tools/verify_ticker_ci.py --run-dir $run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verification receipts (no board claim)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: base-qualification-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/safevision-base-audit/verification.json
            ${{ runner.temp }}/safevision-base-audit/qualification.replay.json
            ${{ runner.temp }}/safevision-base-audit/qualification.console.log
            ${{ runner.temp }}/safevision-base-audit/byte_verification.json
            ${{ runner.temp }}/safevision-base-audit/sta.replay.json
            ${{ runner.temp }}/safevision-base-audit/uart.replay.json
            ${{ runner.temp }}/safevision-base-audit/frozen_objects.import.json
            ${{ runner.temp }}/safevision-base-audit/baseline-replay/verification.json
            ${{ runner.temp }}/safevision-base-audit/baseline-replay.log
            ${{ runner.temp }}/safevision-base-audit/supplementary/summary.json
            ${{ runner.temp }}/safevision-records.json
