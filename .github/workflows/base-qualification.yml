name: BASE source and qualification replay
on:
  push:
    branches: [main]
    paths:
      - 'safevision/**'
      - 'evidence/v3/**'
      - 'artifacts/releases/BASE_26102004_5cff94e/**'
      - 'artifacts/board_validation/four_features_BASE_KEYFIX_5cff94e/**'
      - 'artifacts/releases/BASE_26102301_6a957b0/**'
      - 'artifacts/releases/BASE_26102801/**'
      - 'docs/releases/BASE_26102301/**'
      - 'docs/**'
      - 'evidence/debug_history/**'
      - 'evidence/repository_cleanup_261026/**'
      - 'evidence/board/**'
      - 'README.md'
      - 'SAFEVISION_CURRENT.md'
      - '.gitattributes'
      - '.github/workflows/base-qualification.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen_baseline:
    name: Preserved BASE 26102301 qualification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 09faac2e8fa718c9f92ef4a5013b68003ec8afe6
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/artifacts/*
            /artifacts/releases/
            !/artifacts/releases/*
            /artifacts/releases/BASE_26102301_6a957b0/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned evidence-audit dependencies
        run: python -m pip install pypdf==6.10.0 numpy==2.3.5 PyYAML==6.0.3
      - name: Verify all frozen baseline checks
        shell: pwsh
        run: |
          foreach ($tool in @('test_base_delivery.py','test_current_base_ci.py','test_repository_records.py')) {
            python -B (Join-Path 'safevision/tools' $tool)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -B safevision/tools/audit_repository_records.py --output "$env:RUNNER_TEMP/safevision-baseline-records.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B safevision/tools/verify_current_base_ci.py --run-dir "$env:RUNNER_TEMP/safevision-baseline-replay"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save frozen baseline receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-frozen-baseline-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/safevision-baseline-records.json
            ${{ runner.temp }}/safevision-baseline-replay/verification.json

  audit:
    needs: frozen_baseline
    # A failed or cancelled baseline must make this required check fail too.
    if: always()
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Checkout temporarily changes HOME. Supply Git's command-scope config
      # as well, so the long-path setting applies before any checkout occurs.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Require successful frozen baseline
        shell: pwsh
        env:
          BASELINE_RESULT: ${{ needs.frozen_baseline.result }}
        run: |
          if ($env:BASELINE_RESULT -ne 'success') { throw 'Frozen baseline did not pass' }
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4 tag resolved at delivery
        with:
          fetch-depth: 0 # The independent frozen references require history.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/artifacts/*
            /artifacts/releases/
            !/artifacts/releases/*
            /artifacts/releases/BASE_26102301_6a957b0/
            /artifacts/releases/BASE_26102801/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # official v4
        with:
          node-version: '24'
      - name: Install pinned evidence-audit dependencies
        run: python -m pip install pypdf==6.10.0 numpy==2.3.5 PyYAML==6.0.3
      - name: Reject corrupted or escaping ticker evidence archives
        run: python -B safevision/tools/test_ticker_archive261028.py
      - name: Reject inconsistent UART evidence using synthetic fixtures
        run: python -B safevision/tools/test_ticker_uart261028.py
      - name: Verify Flash installation and reject corrupted evidence
        shell: pwsh
        run: |
          python -B safevision/tools/test_ticker_flash261028.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B safevision/tools/verify_ticker_flash261028.py --output "$env:RUNNER_TEMP/safevision-flash-audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify debug archives, retained evidence and documentation links
        shell: pwsh
        run: |
          python -B safevision/tools/audit_repository_records.py --output "$env:RUNNER_TEMP/safevision-records.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay current ticker delivery
        shell: pwsh
        run: |
          # The frozen baseline job runs the same preserved checks as the
          # local verify_ticker_ci main entry. Its success is required above.
          @'
          from pathlib import Path
          import json, os, sys
          root = Path.cwd()
          sys.path.insert(0, str(root / 'safevision/tools'))
          from verify_ticker_ci import verify
          out = Path(os.environ['RUNNER_TEMP']) / 'safevision-base-audit'
          if out.exists():
              raise ValueError('Fresh verification directory required')
          out.mkdir()
          try:
              result = verify(root, out)
              result['baseline_execution'] = 'Separate frozen_baseline job, required to succeed'
          except Exception as error:
              result = dict(accepted=False, error=type(error).__name__ + ': ' + str(error))
          (out / 'verification.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print('CURRENT TICKER DELIVERY ' + ('PASS' if result['accepted'] else 'FAILED: ' + result['error']))
          raise SystemExit(0 if result['accepted'] else 1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verification receipts (no board claim)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: base-qualification-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/safevision-base-audit/verification.json
            ${{ runner.temp }}/safevision-base-audit/qualification.replay.json
            ${{ runner.temp }}/safevision-base-audit/qualification.console.log
            ${{ runner.temp }}/safevision-base-audit/byte_verification.json
            ${{ runner.temp }}/safevision-base-audit/sta.replay.json
            ${{ runner.temp }}/safevision-base-audit/uart.replay.json
            ${{ runner.temp }}/safevision-base-audit/frozen_objects.import.json
            ${{ runner.temp }}/safevision-base-audit/baseline-replay/verification.json
            ${{ runner.temp }}/safevision-base-audit/baseline-replay.log
            ${{ runner.temp }}/safevision-base-audit/supplementary/summary.json
            ${{ runner.temp }}/safevision-records.json
            ${{ runner.temp }}/safevision-flash-audit.json
