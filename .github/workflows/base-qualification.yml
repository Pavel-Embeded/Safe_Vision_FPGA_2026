name: BASE source and qualification replay
on:
  push:
    branches: [main]
    paths:
      - 'safevision/**'
      - 'evidence/v3/**'
      - 'artifacts/releases/BASE_26102004_5cff94e/**'
      - 'artifacts/board_validation/four_features_BASE_KEYFIX_5cff94e/**'
      - '.gitattributes'
      - '.github/workflows/base-qualification.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4 tag resolved at delivery
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install PDF reader used by the unchanged pin audit
        run: python -m pip install pypdf==6.10.0
      - name: Reject corrupted or escaping delivery inputs
        run: python -B safevision/tools/test_base_delivery.py
      - name: Replay exact functional, pin, resource and routed STA evidence
        shell: pwsh
        run: |
          $run = Join-Path $env:RUNNER_TEMP 'safevision-base-audit'
          python -B safevision/tools/verify_base_delivery.py --run-dir $run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verification receipts (no board claim)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: base-qualification-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/safevision-base-audit/verification.json
            ${{ runner.temp }}/safevision-base-audit/qualification.replay.json
            ${{ runner.temp }}/safevision-base-audit/qualification.console.log
