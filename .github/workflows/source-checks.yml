name: Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B safevision/tools/check_source_tree.py
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -B safevision/tools/check_source_tree.py --simulate --engine iverilog --suite ticker261028 --suite spectrum539 --top tb_v3_ticker_clip --top tb_v3_spectrum539 --output "$RUNNER_TEMP/simulation"
